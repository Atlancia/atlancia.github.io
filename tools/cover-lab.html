function fillRows(base, label) {
  return [
    { type: 'select', path: base + '.type', label: label + ' fill', opts: FILL_TYPES },
    { type: 'range', path: base + '.alpha', label: 'Opacity', min: 0, max: 100 },
    { type: 'colour', path: base + '.c1', label: 'Colour 1' },
    { type: 'colour', path: base + '.c2', label: 'Colour 2', when: base + '.type=vgrad|hgrad|dgrad|radial|conic' },
    { type: 'range', path: base + '.angle', label: 'Angle', min: 0, max: 360, when: base + '.type=vgrad|hgrad|dgrad|radial|conic' },
    { type: 'range', path: base + '.glowX', label: 'Glow X', min: 0, max: 600, when: base + '.type=radial' },
    { type: 'range', path: base + '.glowY', label: 'Glow Y', min: 0, max: 200, when: base + '.type=radial' },
    { type: 'range', path: base + '.glowR', label: 'Glow size', min: 20, max: 500, when: base + '.type=radial' },
    { type: 'image', path: base, label: 'Image', when: base + '.type=image' }
  ];
}

const CONTROL_GROUPS = [
  { title: 'Region A', note: 'ground', rows: fillRows('a', 'Ground') },
  {

      { type: 'range', path: 'divider.position', label: 'Position', min: 0, max: 100, when: when('position') },
      { type: 'range', path: 'divider.angle', label: 'Angle', min: 0, max: 180, when: when('angle') },
      { type: 'range', path: 'divider.waveAmp', label: 'Wave amp', min: 0, max: 60, when: when('wave') },
      { type: 'range', path: 'divider.waveFreq', label: 'Wave freq', min: 1, max: 10, when: when('wave') },
      { type: 'range', path: 'divider.size', label: 'Size', min: 5, max: 400, when: when('size') },
      { type: 'range', path: 'divider.shapes', label: 'Shape count', min: 1, max: 60, when: when('seed') },

function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj); }
function setPath(obj, path, v) {
  const parts = path.split('.');
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = v;
}

const SUFFIX = { 'anim.duration': 's' };

function makeRow(row) {
  const el = document.createElement('div');
  el.className = 'control-row';
  if (row.when) el.dataset.when = row.when;

  if (row.type === 'check') {
    const lab = document.createElement('label');
    lab.className = 'check-row';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.dataset.path = row.path;
    lab.appendChild(input);
    lab.appendChild(document.createTextNode(' ' + row.label));
    el.appendChild(lab);
    return el;
  }

  if (row.type === 'playhead') {
    const wrap = document.createElement('div');
    wrap.className = 'control-row';
    const play = document.createElement('button');
    play.id = 'play-toggle';
    play.textContent = 'Pause';
    const reset = document.createElement('button');
    reset.className = 'secondary';
    reset.id = 'anim-reset';
    reset.textContent = 'Reset';
    wrap.appendChild(play);
    wrap.appendChild(reset);

    const scrubRow = document.createElement('div');
    scrubRow.className = 'control-row';
    const lab = document.createElement('label');
    lab.textContent = 'Scrub';
    const scrub = document.createElement('input');
    scrub.type = 'range';
    scrub.id = 'anim-scrub';
    scrub.min = 0; scrub.max = 3; scrub.step = 0.01; scrub.value = 0;
    const val = document.createElement('span');
    val.className = 'value-display';
    val.id = 'anim-scrub-val';
    val.textContent = '0.00s';
    scrubRow.appendChild(lab);
    scrubRow.appendChild(scrub);
    scrubRow.appendChild(val);

    const out = document.createDocumentFragment();
    out.appendChild(wrap);
    out.appendChild(scrubRow);
    const frames = document.createElement('div');
    frames.className = 'hint';
    frames.id = 'anim-frames';
    out.appendChild(frames);
    const holder = document.createElement('div');
    holder.appendChild(out);
    return holder;
  }

  if (row.type === 'sub') {
    const sub = document.createElement('div');
    sub.className = 'group-sub';
    sub.textContent = row.label;
    return sub;
  }

  if (row.type === 'icons') {
    const holder = document.createElement('div');
    const search = document.createElement('input');
    search.type = 'search';
    search.placeholder = 'Search ' + ICON_NAMES.length + ' icons...';
    search.style.cssText = 'width:100%;background:#35353a;color:#e0e0e0;border:1px solid #555;border-radius:4px;padding:4px 8px;font-size:0.76rem;margin-bottom:6px;';
    search.addEventListener('input', () => buildIconGrid(search.value));
    holder.appendChild(search);
    const grid = document.createElement('div');
    grid.id = 'icon-grid';
    grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:4px;max-height:170px;overflow-y:auto;padding:4px;background:#222;border-radius:4px;width:100%';
    holder.appendChild(grid);
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = 'Click to add at centre, drag on canvas, double-click to remove.';
    holder.appendChild(hint);
    return holder;
  }

  if (row.type === 'folder') {
    const holder = document.createElement('div');
    holder.className = 'control-block';
    holder.style.cssText = 'display:grid;gap:5px;margin-top:6px';
    const open = document.createElement('button');
    open.type = 'button';
    open.textContent = activeDir ? 'Folder: ' + activeDir.name : 'Open folder...';
    open.onclick = () => openCoverFolder();
    const pick = document.createElement('select');
    const blank = document.createElement('option');
    blank.value = '';
    blank.textContent = activeCovers.length ? 'Load a composition...' : 'No compositions found';
    pick.appendChild(blank);
    activeCovers.forEach((name) => {
      const o = document.createElement('option');
      o.value = name;
      o.textContent = name.replace('-composition.json', '');
      pick.appendChild(o);
    });
    pick.onchange = () => { if (pick.value) loadCoverFromFolder(pick.value); };
    const save = document.createElement('button');
    save.type = 'button';
    save.textContent = 'Save SVG + composition here';
    save.onclick = () => saveCoverToFolder();
    holder.append(open, pick, save);
    return holder;
  }

  if (row.type === 'reroll') {
    const holder = document.createElement('div');
    holder.className = 'control-block';
    holder.style.cssText = 'display:flex;align-items:center;gap:7px;margin-bottom:5px';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = row.label || 'Re-randomise';
    btn.onclick = () => {
      const target = getPath(S, row.path);
      const next = (Number(target) || 0) + 1 + Math.floor(Math.random() * 97);
      setPath(S, row.path, next);
      buildPanel();
      drawPreview();
    };
    holder.appendChild(btn);
    return holder;
  }

  if (row.type === 'iconprops') {
    const holder = document.createElement('div');
    holder.className = 'control-block';
    holder.style.cssText = 'display:grid;gap:4px;margin-top:6px';
    // Timing is per icon, but it used to appear only once an icon was selected,
    // which made it look missing. With icons in the scene it now edits the
    // selected one, or the first if none is.
    const idx = selectedIconIdx >= 0 ? selectedIconIdx : 0;
    const ic = S.icons[idx];
    if (!ic) {
      holder.innerHTML = '<div class="hint">Add an icon, and its own motion and timing appear here.</div>';
      return holder;
    }
    const line = (label, node) => {
      const r = document.createElement('div');
      r.className = 'control-row';
      const l = document.createElement('label');
      l.textContent = label;
      l.style.cssText = 'flex:0 0 84px;font-size:.72rem;color:#8a8a92';
      r.append(l, node);
      return r;
    };
    const sel = document.createElement('select');
    [['', 'Use global'], ['none', 'None'], ['spin', 'Spin'], ['float', 'Float'], ['pulse', 'Pulse'], ['orbit', 'Orbit'], ['sway', 'Sway'], ['wobble', 'Wobble']].forEach(([v, t]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o);
    });
    sel.value = ic.motion || '';
    sel.onchange = () => { ic.motion = sel.value || undefined; drawPreview(); };
    const speed = document.createElement('input');
    speed.type = 'range'; speed.min = '0.25'; speed.max = '3'; speed.step = '0.25'; speed.value = ic.speed || 1;
    speed.oninput = () => { ic.speed = Number(speed.value); drawPreview(); };
    const dir = document.createElement('select');
    [['1', 'Clockwise'], ['-1', 'Anticlockwise']].forEach(([v, t]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = t; dir.appendChild(o);
    });
    dir.value = String(ic.dir || 1);
    dir.onchange = () => { ic.dir = Number(dir.value); drawPreview(); };
    const phase = document.createElement('input');
    phase.type = 'range'; phase.min = '0'; phase.max = '6.3'; phase.step = '0.1'; phase.value = ic.phase || 0;
    phase.oninput = () => { ic.phase = Number(phase.value); drawPreview(); };
    const alpha = document.createElement('input');
    alpha.type = 'range'; alpha.min = '0'; alpha.max = '100'; alpha.step = '1'; alpha.value = ic.alpha === undefined ? 100 : ic.alpha;
    alpha.oninput = () => { ic.alpha = Number(alpha.value); drawPreview(); };
    const size = document.createElement('input');
    size.type = 'range'; size.min = '8'; size.max = '400'; size.step = '1'; size.value = ic.size;
    size.oninput = () => { ic.size = Number(size.value); drawPreview(); };
    const actions = document.createElement('div');
    actions.className = 'control-row';
    const dup = document.createElement('button');
    dup.type = 'button'; dup.textContent = 'Duplicate';
    dup.onclick = () => {
      S.icons.push({ ...ic, x: clamp(ic.x + 24, 0, W), y: clamp(ic.y + 24, 0, H) });
      selectedIconIdx = S.icons.length - 1;
      buildPanel(); drawPreview();
    };
    const del = document.createElement('button');
    del.type = 'button'; del.textContent = 'Delete';
    del.onclick = () => {
      S.icons.splice(idx, 1);
      selectedIconIdx = -1;
      buildPanel(); drawPreview();
    };
    actions.append(dup, del);
    holder.append(line('Size', size), line('Motion', sel), line('Speed', speed), line('Direction', dir), line('Phase', phase), line('Opacity', alpha), actions);
    return holder;
  }

  if (row.type === 'composition') {
    const wrap = document.createElement('div');

      '<button class="secondary" id="load-json-btn">Load JSON</button>' +

    if (row.when) holder.dataset.when = row.when;
    const pick = document.createElement('div');

    const btn = document.createElement('button');
    btn.className = 'secondary';
    btn.textContent = 'Choose';

    name.className = 'file-name';
    name.dataset.imageName = row.path;
    const clear = document.createElement('button');
    clear.className = 'secondary';
    clear.textContent = 'Clear';
    clear.style.flex = '0 0 auto';
    const file = document.createElement('input');
    file.type = 'file';

    file.style.display = 'none';
    file.addEventListener('change', e => {
      const f = e.target.files && e.target.files[0];

  return el;
}

function buildPanel() {
  // This runs on every selection, motion change and panel rebuild. It used to
  // append, so each rebuild stacked another copy of every group: clicking icons
  // until seventeen rails were on screen. Replace, and keep the scroll.
  const scroll = controlsEl.scrollTop;
  controlsEl.textContent = '';
  stageEl.textContent = '';

  const frag = document.createDocumentFragment();
  const stageFrag = document.createDocumentFragment();

  CONTROL_GROUPS.forEach(group => {
    const g = document.createElement('div');
    g.className = 'control-group';
    const h = document.createElement('h3');
    h.textContent = group.title;
    if (group.note) {
      const nb = document.createElement('span');
      nb.className = 'badge';
      nb.textContent = group.note;
      h.appendChild(nb);
    }
    const chev = document.createElement('span');
    chev.className = 'chev';
    chev.textContent = '▾';
    h.appendChild(chev);

    // The rail holds eight groups and got long enough to be unreadable. Headers
    // fold, and folding is the only thing that hides a row: the state default is
    // open, so nothing disappears on its own.
    const body = document.createElement('div');
    body.className = 'group-body';
    group.rows.forEach(row => body.appendChild(makeRow(row)));
    if (collapsedGroups.has(group.title)) g.classList.add('collapsed');
    h.addEventListener('click', () => {
      g.classList.toggle('collapsed');
      if (g.classList.contains('collapsed')) collapsedGroups.add(group.title);
      else collapsedGroups.delete(group.title);
    });

    g.appendChild(h);
    g.appendChild(body);
    (group.zone === 'stage' ? stageFrag : frag).appendChild(g);
  });

  const presets = document.createElement('div');
  presets.className = 'control-group';
  presets.innerHTML = '<h3>Presets</h3><div class="preset-row" id="preset-row"></div>';
  frag.appendChild(presets);

  const footer = document.createElement('div');
  footer.className = 'control-group';
  footer.innerHTML = '<label class="check-row"><input type="checkbox" id="hide-inactive"> Hide controls that do not apply</label>' +
    '<div class="hint">Every option configures something, so none of them are removed. Rows fade when the current option does not use them and stay clickable, because a cover can need a row the rule did not expect.</div>';
  frag.appendChild(footer);

  stageEl.appendChild(stageFrag);
  controlsEl.appendChild(frag);
  controlsEl.scrollTop = scroll;
  // The palette is rebuilt with the panel, so it has to be refilled here or the
  // grid comes back empty.
  if (stageEl.querySelector('#icon-grid')) buildIconGrid();
  // New elements carry no is-inactive class until something refreshes them, so
  // the dimming has to be recomputed here or it lags a rebuild behind.
  refreshApplicability();
}

function whenOk(expr) {
  return expr.split(',').some(term => {
    term = term.trim();
    if (!term) return true;
    if (term.startsWith('!')) {
      const [p, v] = term.slice(1).split('=');
      return String(getPath(S, p)) !== v;
    }
    if (term.includes('!=')) {
      const [p, v] = term.split('!=');
      return !v.split('|').includes(String(getPath(S, p)));
    }
    const [p, v] = term.split('=');
    return v.split('|').includes(String(getPath(S, p)));
  });
}

function refreshApplicability() {
  document.querySelectorAll('[data-when]').forEach(el => {
    el.classList.toggle('is-inactive', !whenOk(el.dataset.when));
  });
}

function refreshColours() {
  document.querySelectorAll('[data-colour-path]').forEach(chip => {
    const v = getPath(S, chip.dataset.colourPath);
    if (!v) return;
    const sw = chip.querySelector('i');
    const hex = chip.querySelector('span');
    if (sw) sw.style.background = v;
    if (hex) hex.textContent = String(v);
  });
  document.querySelectorAll('[data-image-name]').forEach(el => {
    const im = imageSpecFor(el.dataset.imageName);
    el.textContent = im && im.name ? im.name : 'no image';
  });
}

function syncControls() {
  document.querySelectorAll('[data-path]').forEach(el => {
    const v = getPath(S, el.dataset.path);
    if (v === undefined || v === null) return;
    if (el.type === 'checkbox') el.checked = !!v;
    else el.value = String(v);
  });
  document.querySelectorAll('.value-display[id^="v-"]').forEach(el => {
    const path = el.id.slice(2).replace(/-/g, '.');
    const v = getPath(S, path);
    el.textContent = v + (SUFFIX[path] || '');
  });
  const scrub = document.getElementById('anim-scrub');
  if (scrub) scrub.max = S.anim.duration;
  const frames = document.getElementById('anim-frames');
  if (frames) frames.textContent = Math.round(S.anim.duration * S.anim.fps) + ' frames per loop, rendered at ' + S.out.scale + 'x';
  const playBtn = document.getElementById('play-toggle');
  if (playBtn) playBtn.textContent = playing ? 'Pause' : 'Play';
  refreshColours();
  refreshApplicability();
}

function onStateChanged() {
  refreshApplicability();
  if (!playing) drawPreview();
}

/* ==========================================================================
   Playback and preview
   ========================================================================== */

let playing = true;
let tNow = 0;
let lastTs = 0;
let acc = 0;

function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastTs) { lastTs = ts; return; }
  const dt = Math.min(0.1, (ts - lastTs) / 1000);
  lastTs = ts;
  if (!playing) return;
  const step = 1 / S.anim.fps;
  acc += dt;
  if (acc + 1e-9 >= step) {
    const advance = Math.floor(acc / step) * step;
    acc -= advance;
    tNow = (tNow + advance) % Math.max(0.05, S.anim.duration);
    syncPlayhead();
    drawPreview();
  }
}

function syncPlayhead() {
  const scrub = document.getElementById('anim-scrub');
  if (scrub) { scrub.max = S.anim.duration; scrub.value = tNow; }
  const val = document.getElementById('anim-scrub-val');
  if (val) val.textContent = tNow.toFixed(2) + 's';
}

function setPlaying(v) {
  playing = v;
  const btn = document.getElementById('play-toggle');
  if (btn) btn.textContent = v ? 'Pause' : 'Play';
}

function drawPreview() {
  drawScene(ctx, buildScene(S, tNow), previewScale);
  drawSelection();
}

function drawSelection() {
  const ic = S.icons[selectedIconIdx];
  if (!ic) return;
  const half = ic.size / 2;
  ctx.save();
  ctx.setTransform(previewScale, 0, 0, previewScale, 0, 0);
  ctx.strokeStyle = '#ffc074';
  ctx.setLineDash([4, 3]);
  ctx.lineWidth = 1;
  ctx.strokeRect(ic.x - half, ic.y - half, ic.size, ic.size);
  // The grabbed corner: filled, and outlined so it reads against any artwork.
  ctx.setLineDash([]);
  ctx.fillStyle = '#ffc074';
  ctx.fillRect(ic.x + half - 5, ic.y + half - 5, 10, 10);
  ctx.strokeStyle = '#1a1a1e';
  ctx.strokeRect(ic.x + half - 5, ic.y + half - 5, 10, 10);
  ctx.restore();
}

/* The preview used to be a 600 x 200 buffer stretched to the panel width, which
   turned grain into mush and softened every edge. Match the backing store to
   the displayed size instead, capped at 3x. */
function fitPreview() {
  if (bareLocked) return;
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvasWrap.clientWidth || W;
  const target = clamp(Math.round((cssW * dpr) / W * 2) / 2, 1, 3);
  if (target === previewScale && canvas.width === Math.round(W * target)) return;
  previewScale = target;
  canvas.width = Math.round(W * target);
  canvas.height = Math.round(H * target);
  drawPreview();
}

function renderToCanvas(scale, time) {
  const cv = document.createElement('canvas');
  cv.width = Math.round(W * scale);
  cv.height = Math.round(H * scale);
  const c = cv.getContext('2d', { willReadFrequently: true });
  drawScene(c, buildScene(S, time), scale);
  return cv;
}

/* ==========================================================================
   Wiring
   ========================================================================== */

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'anim-scrub') {
    tNow = Number(el.value);
    syncPlayhead();
    drawPreview();
    return;
  }
  if (!el.dataset || !el.dataset.path) return;
  const isNum = el.dataset.numeric === '1' || el.type === 'range';
  const v = el.type === 'checkbox' ? el.checked : isNum ? Number(el.value) : el.value;
  setPath(S, el.dataset.path, v);
  if (el.dataset.path === 'anim.duration' && tNow > S.anim.duration) tNow = 0;
  if (/\.img\.(zoom|x|y|blur|fit|mode)$/.test(el.dataset.path)) imageCache.clear();
  syncControls();
  onStateChanged();
});

document.addEventListener('click', e => {
  if (e.target.id === 'play-toggle') { setPlaying(!playing); lastTs = 0; }
  if (e.target.id === 'anim-reset') { tNow = 0; syncPlayhead(); drawPreview(); }
  const preset = e.target.closest('.preset-btn');
  if (preset) applyPreset(preset.dataset.preset);
});

document.addEventListener('change', e => {
  if (e.target.id === 'hide-inactive') {
    document.body.classList.toggle('hide-inactive', e.target.checked);
    refreshApplicability();
  }
});

document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); lastTs = 0; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedIconIdx >= 0) {
    S.icons.splice(selectedIconIdx, 1);
    selectedIconIdx = -1;
    syncControls();
    drawPreview();
  }
});

/* ---------- icon grid ---------- */

const ICON_NAMES = Object.keys(EMBEDDED_ICONS).sort();

function buildIconGrid(filter) {
  const grid = document.getElementById('icon-grid');
  if (!grid) return;
  grid.innerHTML = '';
  // With 516 icons a bare grid is unusable; the search box above it is the
  // only way to find anything, so keep it and filter as you type.
  const q = (filter || '').trim().toLowerCase();
  const names = q ? ICON_NAMES.filter(n => n.includes(q)) : ICON_NAMES;
  names.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'icon-btn';
    btn.title = name;
    btn.style.cssText = 'background:#3a3a3e;border:1px solid #555;border-radius:4px;padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;aspect-ratio:1';
    const doc = new DOMParser().parseFromString(EMBEDDED_ICONS[name], 'image/svg+xml');
    const svgEl = doc.querySelector('svg');
    if (svgEl) {
      svgEl.setAttribute('width', '18');
      svgEl.setAttribute('height', '18');
      svgEl.setAttribute('stroke', '#e0e0e0');
      svgEl.setAttribute('stroke-width', '2');
      btn.appendChild(document.importNode(svgEl, true));
    } else {
      btn.textContent = name.slice(0, 3);
    }
    btn.addEventListener('click', () => addIcon(name));
    grid.appendChild(btn);
  });
  ICON_NAMES.forEach(nm => loadIcon(nm).catch(() => {}));
}

function addIcon(name) {
  S.icons.push({ name, x: W / 2, y: H / 2, size: S.icon.size, color: S.icon.color });
  selectedIconIdx = S.icons.length - 1;
  buildPanel();
  drawPreview();
}

let isDragging = false;
let dragMoved = false;
let dragIdx = -1;
let isResizing = false;
let resizeStart = null;
const dragOff = { x: 0, y: 0 };

function toBaseCoords(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (W / rect.width),
    y: (e.clientY - rect.top) * (H / rect.height)
  };
}

function iconAt(x, y) {
  for (let i = S.icons.length - 1; i >= 0; i--) {
    const ic = S.icons[i], half = ic.size / 2;
    if (x >= ic.x - half && x <= ic.x + half && y >= ic.y - half && y <= ic.y + half) return i;
  }
  return -1;
}

/* The resize handle sits on the selected icon's corner. Base units, so it holds
   its proportion against the canvas whatever the preview scale. */
const HANDLE_REACH = 11;
function handleAt(x, y) {
  const ic = S.icons[selectedIconIdx];
  if (!ic) return false;
  return Math.abs(x - (ic.x + ic.size / 2)) <= HANDLE_REACH &&
         Math.abs(y - (ic.y + ic.size / 2)) <= HANDLE_REACH;
}

canvasWrap.addEventListener('mousedown', e => {
  const p = toBaseCoords(e);

  // The corner handle resizes the selected icon. Without it the only way to
  // change a size was the slider in the rail, which is not where you are looking.
  if (handleAt(p.x, p.y)) {
    isResizing = true;
    resizeStart = { px: p.x, py: p.y, size: S.icons[selectedIconIdx].size };
    e.preventDefault();
    return;
  }

  const idx = iconAt(p.x, p.y);
  if (idx >= 0) {
    const changed = idx !== selectedIconIdx;
    selectedIconIdx = idx;
    if (changed) buildPanel();
    isDragging = true;
    dragIdx = idx;
    dragMoved = false;
    dragOff.x = p.x - S.icons[idx].x;
    dragOff.y = p.y - S.icons[idx].y;
    canvasWrap.style.cursor = 'grabbing';
  } else {
    if (selectedIconIdx !== -1) buildPanel();
    selectedIconIdx = -1;
  }
  drawPreview();
});

canvasWrap.addEventListener('mousemove', e => {
  const p = toBaseCoords(e);

  if (isResizing) {
    const ic = S.icons[selectedIconIdx];
    if (!ic) return;
    // Distance from the icon's centre to the pointer, doubled: the handle sits on
    // the corner, so it tracks the box the icon occupies without a jump.
    const reach = Math.max(Math.abs(p.x - ic.x), Math.abs(p.y - ic.y));
    ic.size = Math.round(clamp(reach * 2, 8, 400));
    drawPreview();
    return;
  }

  if (isDragging && dragIdx >= 0) {
    if (!dragMoved) {
      const moved = Math.abs(p.x - (S.icons[dragIdx].x + dragOff.x)) + Math.abs(p.y - (S.icons[dragIdx].y + dragOff.y));
      if (moved < 2) return;          // a click, not a drag: leave the icon where it is
      dragMoved = true;
    }
    S.icons[dragIdx].x = clamp(p.x - dragOff.x, 0, W);
    S.icons[dragIdx].y = clamp(p.y - dragOff.y, 0, H);
    drawPreview();
    return;
  }

  if (!isDragging && !isResizing) {
    canvasWrap.style.cursor = handleAt(p.x, p.y) ? 'nwse-resize' : iconAt(p.x, p.y) >= 0 ? 'grab' : 'default';
  }
});

['mouseup', 'mouseleave'].forEach(evt => canvasWrap.addEventListener(evt, () => {
  const resized = isResizing;
  isDragging = false;
  dragIdx = -1;
  dragMoved = false;
  isResizing = false;
  canvasWrap.style.cursor = 'default';
  if (resized) buildPanel();          // move the size slider to match the drag
}));

canvasWrap.addEventListener('dblclick', e => {
  const p = toBaseCoords(e);
  const idx = iconAt(p.x, p.y);
  if (idx >= 0) { S.icons.splice(idx, 1); selectedIconIdx = -1; buildPanel(); drawPreview(); }
});

/* ==========================================================================
   Presets and random
   ========================================================================== */

function applyPreset(name) {
  const fresh = defaultState();
  const patch = PRESETS[name] ? PRESETS[name]() : {};
  S = fresh;
  Object.keys(patch).forEach(k => {
    if (patch[k] && typeof patch[k] === 'object' && !Array.isArray(patch[k])) {
      S[k] = Object.assign(S[k] || {}, patch[k]);
    } else {
      S[k] = patch[k];
    }
  });
  selectedIconIdx = -1;
  tNow = 0;
  syncControls();
  buildIconGrid();
  drawPreview();
}

function randomize() {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const colour = () => pick([...RAMPS[0].colours, ...RAMPS[1].colours, ...BLENDS, ...NEUTRALS]);
  const kinds = DIVIDER_KINDS.map(k => k[0]).filter(k => k !== 'none');
  S.a.type = pick(['solid', 'vgrad', 'hgrad', 'dgrad', 'radial', 'conic']);
  S.a.c1 = colour();
  S.a.c2 = colour();
  S.divider.kind = pick(kinds);
  S.divider.b.type = pick(['solid', 'vgrad', 'hgrad', 'dgrad', 'radial', 'conic']);
  S.divider.b.c1 = colour();
  S.divider.b.c2 = colour();
  S.divider.motion = pick(['none', 'none', 'wipe', 'slide-x', 'spin', 'breathe']);
  S.anim.base = pick(['none', 'none', 'rotate', 'sweep-x', 'pulse']);
  S.treat.type = pick(['none', 'grain-light', 'vignette', 'glow', 'halftone', 'dither', 'bayer', 'posterize', 'duotone', 'paper', 'photocopy', 'scanlines', 'grid']);
  S.treat.intensity = 30 + Math.floor(Math.random() * 60);
  S.treat.c1 = colour();
  S.treat.c2 = colour();
  syncControls();
  onStateChanged();
}

document.getElementById('randomize').addEventListener('click', randomize);

/* The card frame is on to begin with: a cover is composed for two shapes at
   once, and it is cheaper to see the crop while working than to discover it on
   the list. The toggle only changes what the preview shows, never the export. */
document.body.classList.add('show-card-guide');
document.getElementById('toggle-guide').addEventListener('click', () => {
  document.body.classList.toggle('show-card-guide');
  const on = document.body.classList.contains('show-card-guide');
  document.getElementById('toggle-guide').textContent = on ? 'Card frame' : 'Card frame off';
});

/* ==========================================================================
   Exports
   ========================================================================== */

function stillCanvas() { return renderToCanvas(S.out.scale, S.out.exportPoint); }

document.getElementById('export-webp').addEventListener('click', async () => {
  await ensureIconsLoaded();
  await ensureImagesReady();
  const cv = stillCanvas();
  cv.toBlob(blob => {
    if (!blob) { status('WebP encoding unavailable in this browser'); return; }
    downloadBlob(blob, 'cover-' + S.out.scale + 'x.webp');
    status('WebP still at the export point, ' + cv.width + ' x ' + cv.height +
      ', ' + (blob.size / 1024).toFixed(1) + ' KB. This is the poster the page holds.');
  }, 'image/webp', 0.9);
});

document.getElementById('use-scrub').addEventListener('click', () => {
  const at = Math.round(tNow * 100) / 100;
  S.out.exportPoint = at;
  syncControls();
  status('Export point set to ' + at.toFixed(2) + 's. The still and the start of the loop both use that pose.');
  drawPreview();
});

document.getElementById('export-package').addEventListener('click', async () => {
  await ensureIconsLoaded();
  await ensureImagesReady();
  const built = svgBuild(S, { animate: true, scale: S.out.scale });
  const kb = new Blob([built.svg]).size / 1024;
  downloadBlob(new Blob([built.svg], { type: 'image/svg+xml' }), 'cover.svg');
  const hasImage = S.a.type === 'image' || S.divider.b.type === 'image';
  status('Cover package: cover.svg, ' + kb.toFixed(1) + ' KB, with the composition record inside it. ' +
    'Ingest with: python tools/cover_motion.py --source cover.svg --name <name> --media <id> --verify' +
    (hasImage ? ' The uploaded image is embedded in the file, which is why it is larger than usual.' : '') + built.note);
});

/* ---------- composition JSON ---------- */

function mergeState(base, incoming) {
  if (!incoming || typeof incoming !== 'object') return base;
  Object.keys(base).forEach(k => {
    if (incoming[k] === undefined) return;
    if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
      base[k] = Object.assign(base[k], incoming[k]);
    } else {
      base[k] = incoming[k];
    }
  });
  return base;
}

document.addEventListener('click', e => {
  if (e.target.id === 'save-json') {
    downloadBlob(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }), 'cover-composition.json');
    status('composition downloaded');
  }
  if (e.target.id === 'load-json-btn') document.getElementById('load-json').click();
});

document.addEventListener('change', async e => {
  if (e.target.id !== 'load-json') return;
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    S = mergeState(defaultState(), JSON.parse(await file.text()));
    selectedIconIdx = -1;
    tNow = 0;
    imageCache.clear();
    primeImages();
    syncControls();
    buildIconGrid();
    drawPreview();
    status('composition loaded');
  } catch (err) {
    status('load failed: ' + err.message);
  }
  e.target.value = '';
});

/* ==========================================================================
   Init
   ========================================================================== */

buildPanel();
Object.keys(PRESETS).forEach(name => {
  const b = document.createElement('button');
  b.className = 'preset-btn';
  b.dataset.preset = name;
  b.textContent = PRESET_LABELS[name] || name;
  document.getElementById('preset-row').appendChild(b);
});

applyPreset('glow');
primeImages();

const params = new URLSearchParams(location.search);

/* ?bare=N renders the canvas at N times the base size, pixel for pixel the
   same path the still export takes. At 3 it gives 1800 x 600. */
if (params.get('bare')) {
  bareLocked = true;
  const bs = Number(params.get('bare')) || 1;
  document.body.style.padding = '0';
  document.body.style.background = '#000';
  document.querySelectorAll('h1, .controls, .export-row, .status, .drag-hint').forEach(el => { el.style.display = 'none'; });
  document.querySelector('.layout').style.cssText = 'display:block;max-width:none;margin:0;padding:0';
  document.querySelector('.preview-area').style.cssText = 'padding:0;background:#000;border-radius:0';
  document.querySelector('.controls').style.display = 'none';
  if (bs > 1) {
    previewScale = bs;
    canvas.width = W * bs;
    canvas.height = H * bs;
    canvasWrap.style.cssText = 'border-radius:0;aspect-ratio:auto;width:' + W * bs + 'px;height:' + H * bs + 'px';
    canvas.style.cssText = 'width:' + W * bs + 'px;height:' + H * bs + 'px';
  } else {
    canvasWrap.style.cssText = 'border-radius:0;aspect-ratio:auto;width:600px;height:200px';
    canvas.style.cssText = 'width:600px;height:200px';
  }
  drawPreview();
}

if (params.get('preset')) applyPreset(params.get('preset'));
if (params.get('t') !== null) {
  tNow = clamp(Number(params.get('t')) || 0, 0, S.anim.duration);
  syncPlayhead();
  drawPreview();
}

/* ?svg=N replaces the page with the exported vector, so the vector can be
   checked in a browser without going through a download. ?still=1 freezes it,
   ?t0= seconds starts the loop part way in. */
if (params.get('svg')) {
  const paintVector = () => {
    const built = svgBuild(S, {
      animate: !params.get('still'),
      scale: Number(params.get('svg')) || 1,
      begin: Number(params.get('t0')) || 0
    });
    document.body.innerHTML = built.svg;
    document.body.style.cssText = 'background:#000;padding:0;margin:0';
  };
  Promise.all([ensureIconsLoaded(), ensureImagesReady()]).then(paintVector).catch(paintVector);
}

fitPreview();
if (window.ResizeObserver) new ResizeObserver(fitPreview).observe(canvasWrap);
setPlaying(params.get('play') !== '0');
if (!playing) drawPreview();
requestAnimationFrame(loop);

window.__lab = {
  state: () => S,
  preset: applyPreset,
  draw: drawPreview,
  at: t => { tNow = t; drawPreview(); },
  svg: animate => svgBuild(S, { animate, scale: S.out.scale }).svg
};
</script>
</body>
</html>
