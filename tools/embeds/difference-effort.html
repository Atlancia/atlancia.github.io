<!-- Atlancia embed: Difference - two people, three bargains (interactive).
     Fits the post Difference Needs Somewhere to Go.
     Columns are the three bargains; rows are UI, Dev, and the work itself.
     Click a bargain to isolate its column.
     slop-ok: exclamation marks are logical-not operators in inline script, not prose emphasis. -->
<div class="atlx atlx-div-effort">
  <style>
    .atlx-div-effort {
      --ef-ink: var(--atl-ink, #EEEDED);
      --ef-text: var(--atl-figure-text, #BFBFBF);
      --ef-dim: var(--atl-dim, #9D9D9D);
      --ef-line: var(--atl-line, #373737);
      --ef-surface: var(--atl-surface, #1e1e1e);
      --ef-amber: var(--atl-accent, #FFC074);
      --ef-purple: #a78bfa;
      font-family: "Cal Sans", ui-sans-serif, system-ui, sans-serif;
      background: var(--ef-surface);
      color: var(--ef-text);
      border: 1px solid var(--ef-line);
      border-radius: 6px;
      padding: 1.3rem 1.3rem 1.1rem;
      margin: 2.5rem 0;
      max-width: 100%;
      font-size: 1rem;
      line-height: 1.55;
    }
    .atlx-div-effort * { box-sizing: border-box; }
    .atlx-div-effort .atlx-ef-title {
      margin: 0 0 .2rem;
      font-family: "Young Serif", Georgia, serif;
      font-weight: 500;
      font-size: 1.25rem;
      line-height: 1.35;
      color: var(--ef-ink);
    }
    .atlx-div-effort .atlx-ef-sub { margin: 0 0 .3rem; color: var(--ef-dim); font-size: .95rem; max-width: 44rem; }
    .atlx-div-effort svg { display: block; width: 100%; height: auto; }
    .atlx-div-effort svg text { user-select: none; }
  </style>
  <h3 class="atlx-ef-title">Two people, three bargains</h3>
  <p class="atlx-ef-sub">Each column is a bargain. Gray effort fits in; amber effort shapes the work. Click a bargain to isolate its column.</p>
  <noscript><p style="font-size:.9rem;">This figure is interactive, but the gist needs no script: wearing the mask spends effort fitting in and shrinks the work to copies; holding part back locks away the best and keeps the work safe but small; moving toward each other spends effort on the work and makes it better than the sum.</p></noscript>

  <svg id="ddf2-svg" role="img" aria-label="UI and Dev across three bargains, plus what happens to the work"></svg>
  <script>
  (function(){
    var root = document.currentScript && document.currentScript.closest ? document.currentScript.closest('.atlx-div-effort') : document.querySelector('.atlx-div-effort');
    if(!root) return;
    var NS = 'http://www.w3.org/2000/svg';
    var INK = 'var(--ef-ink)', DIM = 'var(--ef-dim)', LINE = 'var(--ef-line)', AMBER = 'var(--ef-amber)', PURPLE = 'var(--ef-purple)';
    var CH = 21, CFONT = 11;
    function el(name, attrs, parent){
      var n = document.createElementNS(NS, name);
      for(var k in attrs) n.setAttribute(k, attrs[k]);
      parent.appendChild(n);
      return n;
    }
    function txt(parent, x, y, s, size, weight, fill, anchor){
      var t = el('text', {x: x, y: y, 'font-size': size, 'font-weight': weight || 400, fill: fill || INK, 'text-anchor': anchor || 'middle', 'font-family': '"Cal Sans", sans-serif'}, parent);
      t.textContent = s;
      return t;
    }
    function icon(parent, id, x, y, s, color, w){
      var u = el('use', {href: '#' + id, x: x, y: y, width: s, height: s}, parent);
      u.setAttribute('fill', 'none');
      u.setAttribute('stroke', color);
      u.setAttribute('stroke-width', w);
      u.setAttribute('stroke-linecap', 'round');
      u.setAttribute('stroke-linejoin', 'round');
      return u;
    }
    function micon(parent, d, x, y, s, color){
      var sc = s / 960;
      return el('path', {d: d, fill: color, transform: 'translate(' + x + ',' + (y + s) + ') scale(' + sc + ')'}, parent);
    }
    function hexPts(cx, cy, r){
      var p = [];
      for(var i = 0; i < 6; i++){
        var a = Math.PI / 3 * i;
        p.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1));
      }
      return p.join(' ');
    }
    var W = 720;
    var MASKD = 'M760-660q17 0 28.5-11.5T800-700q0-17-11.5-28.5T760-740q-17 0-28.5 11.5T720-700q0 17 11.5 28.5T760-660Zm-160 0q17 0 28.5-11.5T640-700q0-17-11.5-28.5T600-740q-17 0-28.5 11.5T560-700q0 17 11.5 28.5T600-660Zm80 60q-29 0-55.5 11.5T586-551q-5 10 2.5 18.5T608-524h144q12 0 19.5-8.5T774-551q-12-26-38.5-37.5T680-600ZM280-80q-100 0-170-70T40-320v-200q0-33 23.5-56.5T120-600h320q33 0 56.5 23.5T520-520v200q0 100-70 170T280-80Zm0-80q66 0 113-47t47-113v-200H120v200q0 66 47 113t113 47Zm640-640v200q0 102-70 171t-171 69q-17 0-33.5-2t-32.5-7q-16-5-23-20t-2-31q5-16 20-23.5t31-2.5q11 3 21 4.5t21 1.5q66 0 112.5-47T840-600v-200H520v100q0 17-11.5 28.5T480-660q-17 0-28.5-11.5T440-700v-100q0-33 23.5-56.5T520-880h320q33 0 56.5 23.5T920-800ZM200-380q17 0 28.5-11.5T240-420q0-17-11.5-28.5T200-460q-17 0-28.5 11.5T160-420q0 17 11.5 28.5T200-380Zm160 0q17 0 28.5-11.5T400-420q0-17-11.5-28.5T360-460q-17 0-28.5 11.5T320-420q0 17 11.5 28.5T360-380Zm-80 136q28 0 53-11t39-35q5-11-1-20.5t-17-9.5H206q-11 0-17 9.5t-1 20.5q14 24 39 35t53 11Zm0-96Zm390-280Z';
    var BOXD = 'M480-560q-17 0-28.5 11.5T440-520v128l-36-36q-11-11-28-11t-28 11q-11 11-11 28t11 28l104 104q12 12 28 12t28-12l104-104q11-11 11-28t-11-28q-11-11-28-11t-28 11l-36 36v-128q0-17-11.5-28.5T480-560Zm-280-80v440h560v-440H200Zm0 520q-33 0-56.5-23.5T120-200v-499q0-14 4.5-27t13.5-24l50-61q11-14 27.5-21.5T250-840h460q18 0 34.5 7.5T772-811l50 61q9 11 13.5 24t4.5 27v499q0 33-23.5 56.5T760-120H200Zm16-600h528l-34-40H250l-34 40Zm264 300Z';
    var HANDSD = 'M475-160q4 0 8-2t6-4l328-328q12-12 17.5-27t5.5-30q0-16-5.5-30.5T817-607L647-777q-11-12-25.5-17.5T591-800q-15 0-30 5.5T534-777l-11 11 74 75q15 14 22 32t7 38q0 42-28.5 70.5T527-522q-20 0-38.5-7T456-550l-75-74-175 175q-3 3-4.5 6.5T200-435q0 8 6 14.5t14 6.5q4 0 8-2t6-4l108-108q11-11 27.5-11.5T398-528q11 11 11 28t-11 28L291-364q-3 3-4.5 6.5T285-350q0 8 6 14t14 6q4 0 8-2t6-4l108-107q11-11 27.5-11.5T483-443q11 11 11 28t-11 28L376-279q-3 2-4.5 6t-1.5 8q0 8 6 14t14 6q4 0 7.5-1.5t6.5-4.5l108-107q11-11 27.5-11.5T568-358q11 11 11 28t-11 28L460-194q-3 3-4.5 6.5T454-180q0 8 6.5 14t14.5 6Zm-1 80q-37 0-65.5-24.5T375-166q-34-5-57-28t-28-57q-34-5-56.5-28.5T206-336q-38-5-62-33t-24-66q0-20 7.5-38.5T149-506l175-175q23-23 56.5-23t56.5 23l75 75q2 3 6 4.5t8 1.5q9 0 15-5.5t6-14.5q0-4-1.5-8t-4.5-6L398-777q-11-12-25.5-17.5T342-800q-15 0-30 5.5T285-777L144-635q-14 14-20 33t-3 38q3 17-7 30t-27 15q-17 2-30-7.5T42-553q-6-38 5.5-74.5T87-692l141-141q24-23 53.5-35t60.5-12q31 0 60.5 12t52.5 35l11 11 11-11q24-23 53.5-35t60.5-12q31 0 60.5 12t52.5 35l169 169q23 23 35 53t12 61q0 31-12 60.5T873-437L545-110q-14 14-32.5 22T474-80Zm-98-560Z';
    var MODES = [
      {id: 'assim', name: 'Assimilate', move: 'wear the mask', icon: 'mask', fit: 80, win: 16, ribbonW: 2, out: ['Copies']},
      {id: 'contain', name: 'Contain', move: 'give the acceptable part', icon: 'box', fit: 35, win: 40, ribbonW: 3, out: ['safe,', 'smaller']},
      {id: 'channel', name: 'Channel', move: 'move toward each other', icon: 'hands', fit: 10, win: 64, ribbonW: 5, out: ['better', 'together']}
    ];
    var ROWS = [
      {id: 'ux', name: 'UI/UX Analyst', toks: [
        {label: 'Design Thinking', icon: 'ii-light-bulb', bg: false},
        {label: 'Cust. Journey Mapping', icon: 'ii-map', bg: false},
        {label: 'Persona Development', icon: 'ii-people-tag', bg: true}]},
      {id: 'dev', name: 'Senior Developer', toks: [
        {label: 'English Lit. Degree', icon: 'ii-open-book', bg: true},
        {label: 'DBA Background', icon: 'ii-database', bg: false},
        {label: 'Writing & Feedback', icon: 'ii-message-text', bg: false}]}
    ];
    var LABX = 4, LABW = 118, CW = 190, GAPX = 8;
    function colX(i){ return LABX + LABW + GAPX + i * (CW + GAPX); }
    var HH = 66, RH = 148, RGAP = 22, WH = 132;
    function tokState(modeId, tok){
      if(modeId === 'assim') return 'masked';
      if(modeId === 'contain') return tok.bg ? 'Locked' : 'lit';
      return 'lit';
    }
    var svg = root.querySelector('#ddf2-svg');
    var selected = null;
    function dimFor(i){
      return (!selected || selected === i) ? '1' : '0.22';
    }
    function outcome(g, cx, cy, mode){
      el('polygon', {points: hexPts(cx, cy, 26), fill: 'var(--ef-surface)', stroke: INK, 'stroke-width': 2.5}, g);
      if(mode.id === 'assim'){
        [[-10, -6], [9, -8], [0, 5], [-7, 10], [9, 8]].forEach(function(o){
          el('circle', {cx: cx + o[0], cy: cy + o[1], r: 5, fill: DIM, opacity: 0.85}, g);
        });
      } else if(mode.id === 'contain'){
        el('polygon', {points: hexPts(cx, cy, 19), fill: AMBER, opacity: 0.45}, g);
      } else {
        el('polygon', {points: hexPts(cx, cy, 19), fill: AMBER, opacity: 1}, g);
      }
      mode.out.forEach(function(line, li){
        txt(g, cx, cy + 42 + li * 13, line, 11, 700, INK);
      });
    }
    function build(){
      svg.innerHTML = '';
      var y0 = 8;
      MODES.forEach(function(mode, i){
        var x = colX(i);
        var hg = el('g', {'class': 'atlx-ef-mode', tabindex: '0', role: 'button', 'aria-label': 'Isolate ' + mode.name}, svg);
        hg.setAttribute('opacity', dimFor(i));
        el('rect', {x: x, y: y0, width: CW, height: HH, rx: 6, fill: 'rgba(255,255,255,0.02)', stroke: (!selected || selected === i) ? DIM : LINE, 'stroke-width': 1.5}, hg);
        var dd = mode.icon === 'mask' ? MASKD : (mode.icon === 'box' ? BOXD : HANDSD);
        micon(hg, dd, x + 12, y0 + 21, 24, INK);
        txt(hg, x + 46, y0 + 27, mode.name, 13, 700, INK, 'start');
        txt(hg, x + 46, y0 + 43, mode.move, 10.5, 400, DIM, 'start');
        (function(idx){
          function go(){ selected = (selected === idx) ? null : idx; build(); }
          hg.addEventListener('click', go);
          hg.addEventListener('keydown', function(ev){ if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); go(); } });
        })(i);
      });
      var ry = y0 + HH + 14;
      ROWS.forEach(function(m, rii){
        var y = ry + rii * (RH + RGAP);
        el('line', {x1: 4, y1: y - 7, x2: W - 4, y2: y - 7, stroke: LINE, 'stroke-width': 1, opacity: 0.6}, svg);
        txt(svg, LABX, y + 24, m.name, 12.5, 700, INK, 'start');
        MODES.forEach(function(mode, i){
          var x = colX(i);
          var cg = el('g', {}, svg);
          cg.setAttribute('opacity', dimFor(i));
          m.toks.forEach(function(tk, ti){
            var tyr = y + 8 + ti * CH;
            if(tokState(mode.id, tk) === 'Locked'){
              el('rect', {x: x, y: tyr + 2, width: CW, height: CH - 4, rx: 4, fill: 'none', stroke: DIM, 'stroke-width': 1, 'stroke-dasharray': '4 3'}, cg);
            }
            var st = tokState(mode.id, tk);
            var col = st === 'lit' ? (tk.bg ? PURPLE : AMBER) : DIM;
            icon(cg, tk.icon, x + 6, tyr + (CH - 13) / 2, 13, col, 2);
            var tt = el('text', {x: x + 26, y: tyr + 14, 'font-size': CFONT, fill: st === 'masked' ? DIM : INK, 'font-family': '"Cal Sans", sans-serif'}, cg);
            tt.textContent = tk.label;
            if(st === 'Locked') txt(cg, x + CW - 8, tyr + 14, 'Locked', 10, 700, DIM, 'end');
          });
          var by = y + 8 + 3 * CH + 8;
          var fitW = (CW - 4) * (mode.fit / 100);
          el('rect', {x: x, y: by, width: CW - 4, height: 8, rx: 4, fill: 'none', stroke: LINE, 'stroke-width': 1}, cg);
          el('rect', {x: x + 1, y: by + 1, width: Math.max(0, fitW - 2), height: 6, rx: 3, fill: DIM}, cg);
          el('rect', {x: x + 1 + fitW, y: by + 1, width: Math.max(0, CW - 6 - fitW), height: 6, rx: 3, fill: AMBER}, cg);
          var cap = el('text', {x: x, y: by + 22, 'font-size': 10, fill: DIM, 'font-family': '"Cal Sans", sans-serif'}, cg);
          cap.textContent = mode.fit + '% fitting in';
        });
      });
      var wy = ry + ROWS.length * (RH + RGAP) - RGAP + 22;
      var WH = 190;
      el('line', {x1: 4, y1: wy - 14, x2: W - 4, y2: wy - 14, stroke: LINE, 'stroke-width': 1, opacity: 0.6}, svg);
      txt(svg, LABX, wy + 24, 'The work', 12.5, 700, INK, 'start');
      txt(svg, LABX, wy + 40, 'Changes', 10.5, 400, DIM, 'start');
      MODES.forEach(function(mode, i){
        var x = colX(i);
        var wg = el('g', {}, svg);
        wg.setAttribute('opacity', dimFor(i));
        var wcx = x + CW / 2;
        var hx = wcx, hy = wy + 40;
        el('polygon', {points: hexPts(hx, hy, 26), fill: 'var(--ef-surface)', stroke: INK, 'stroke-width': 2.5}, wg);
        if(mode.id === 'assim'){
          [[-10, -6], [9, -8], [0, 5], [-7, 10], [9, 8]].forEach(function(o){
            el('circle', {cx: hx + o[0], cy: hy + o[1], r: 5, fill: DIM, opacity: 0.85}, wg);
          });
          txt(wg, hx, hy + 42, 'Copies', 11, 700, INK);
        } else if(mode.id === 'contain'){
          el('polygon', {points: hexPts(hx, hy, 19), fill: AMBER, opacity: 0.45}, wg);
          txt(wg, hx, hy + 42, 'Safe, smaller', 11, 700, INK);
        } else {
          el('polygon', {points: hexPts(hx, hy, 19), fill: AMBER, opacity: 1}, wg);
          txt(wg, hx, hy + 42, 'Better together', 11, 700, INK);
        }
        var wmid = wy + 126;
        el('rect', {x: wcx - mode.win / 2 - 5, y: wmid - 30, width: 5, height: 60, fill: INK}, wg);
        el('rect', {x: wcx + mode.win / 2, y: wmid - 30, width: 5, height: 60, fill: INK}, wg);
        el('path', {d: 'M' + (x + 8) + ',' + wmid + ' H' + (x + CW - 8), fill: 'none', stroke: 'var(--ef-arrow, #9D9D9D)', 'stroke-width': mode.ribbonW, 'stroke-linecap': 'butt', opacity: 1}, wg);
        txt(wg, wcx, wmid + 44, 'The window', 10, 400, DIM);
      });
      var total = wy + WH;
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + Math.ceil(total));
    }
    build();
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(build);
  })();
  </script>
