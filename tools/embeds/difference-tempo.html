<!-- Atlancia embed: Difference - precious versus provisional (interactive).
     Fits the post Difference Needs Somewhere to Go.
     Statements versus questions across four fates. Time runs left to right.
     slop-ok: exclamation marks are logical-not operators in inline script, not prose emphasis. -->
<div class="atlx atlx-div-tempo">
  <style>

      --tp-line: var(--atl-line, #373737);
      --tp-surface: var(--atl-surface, #1e1e1e);

      border: 1px solid var(--tp-line);
      border-radius: 6px;
      padding: 1.3rem 1.3rem 1.1rem;
      margin: 2.5rem 0;
      max-width: 100%;
      font-size: 1rem;
      line-height: 1.55;
    }
    .atlx-div-tempo * { box-sizing: border-box; }
    .atlx-div-tempo .atlx-tp-title {
      margin: 0 0 .2rem;
      font-family: "Young Serif", Georgia, serif;
      font-weight: 500;
      font-size: 1.25rem;
      line-height: 1.35;
      color: var(--tp-ink);

    .atlx-div-tempo svg { display: block; width: 100%; height: auto; }

  </style>
  <h3 class="atlx-tp-title">What do you believe an idea is?</h3>
  <p class="atlx-tp-sub">Statements versus questions, across four fates. Time runs left to right. Hover a fate to isolate it.</p>
  <noscript><p style="font-size:.9rem;">This figure is interactive, but the gist needs no script: performed ideas drain the performer; statements that meet questions as attacks end with both sides silent; parallel play never tests anything; negotiated ideas, held loosely and questioned with care, become ours and better.</p></noscript>

    }
    var W = 720, T0 = 128, T1 = 704, MIN = 60;

       out: 'polite, nothing real'},
      {id: 'impasse', name: 'The impasse', move: 'statements meet questions', icon: 'forum',
       prep: [{m: [0,14]}],
       eng: [{m: [16,20], q: true}, {m: [22,26], q: true}],

       eng: [],
       prepE: 75, engE: 65, emptyNote: 'no questions asked',

    ];
    var svg = root.querySelector('#ddt2-svg');
    var MH = 196, MGAP = 24;
    function block(g, y, m, o, style, color){
      if(style === 'hollow'){
        el('rect', {x: X(m[0]), y: y - 3, width: Math.max(3, X(m[1]) - X(m[0])), height: 16, rx: 3, fill: 'none', stroke: color, 'stroke-width': 1.5, opacity: o}, g);

        el('rect', {x: X(m[0]), y: y - 3, width: Math.max(3, X(m[1]) - X(m[0])), height: 16, rx: 3, fill: 'none', stroke: color, 'stroke-width': 1.5, opacity: o}, g);
