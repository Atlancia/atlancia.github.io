<!-- Atlancia embed: Difference - the expanding room (interactive).
     Fits the post Difference Needs Somewhere to Go.
     Four teammates hold twelve things only they bring. Share them into the middle
     and the room stretches toward everyone; hold them back and the gap stays wide.
     slop-ok: exclamation marks are logical-not operators in inline script, not prose emphasis. -->
<div class="atlx atlx-div-room">
  <style>
    .atlx-div-room {
      --dr-ink: var(--atl-ink, #EEEDED);
      --dr-text: var(--atl-figure-text, #BFBFBF);
      --dr-dim: var(--atl-dim, #9D9D9D);
      --dr-line: var(--atl-line, #373737);
      --dr-surface: var(--atl-surface, #1e1e1e);
      --dr-amber: var(--atl-accent, #FFC074);
      --dr-code: "Monaspace Neon", ui-monospace, monospace;
      font-family: "Cal Sans", ui-sans-serif, system-ui, sans-serif;
      background: var(--dr-surface);
      color: var(--dr-text);
      border: 1px solid var(--dr-line);
      border-radius: 6px;
      padding: 1.3rem 1.3rem 1.1rem;
      margin: 2.5rem 0;
      max-width: 100%;
      font-size: 1rem;
      line-height: 1.55;
    }
    .atlx-div-room * { box-sizing: border-box; }
    .atlx-div-room .atlx-dr-title {
      margin: 0 0 .2rem;
      font-family: "Young Serif", Georgia, serif;
      font-weight: 500;
      font-size: 1.25rem;
      line-height: 1.35;
      color: var(--dr-ink);
    }
    .atlx-div-room .atlx-dr-sub { margin: 0 0 .3rem; color: var(--dr-dim); font-size: .95rem; max-width: 44rem; }
    .atlx-div-room .atlx-dr-grid { display: grid; grid-template-columns: 1.45fr 1fr; gap: 1.25rem; align-items: start; margin-top: .9rem; }
    @media (max-width: 760px) { .atlx-div-room .atlx-dr-grid { grid-template-columns: 1fr; } }
    .atlx-div-room svg.atlx-dr-svg { display: block; width: 100%; height: auto; }
    .atlx-div-room .atlx-dr-presets { display: flex; gap: .5rem; flex-wrap: wrap; margin: 0 0 1rem; }
    .atlx-div-room .atlx-dr-presets button {
      font: inherit;
      background: transparent;
      border: 1px solid var(--dr-line);
      border-radius: 6px;
      padding: .5rem .7rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: .55rem;
      text-align: left;
      flex: 1 1 8rem;
    }
    .atlx-div-room .atlx-dr-presets button svg { width: 22px; height: 22px; flex: none; }
    .atlx-div-room .atlx-dr-presets button svg path { fill: var(--dr-ink, #EEEDED); }
    .atlx-div-room .atlx-dr-presets button[aria-pressed="true"] { border-color: var(--dr-dim); }
    .atlx-div-room .atlx-dr-presets button:focus-visible { outline: 2px solid var(--dr-amber); outline-offset: 3px; }
    .atlx-div-room .atlx-dr-name { display: block; font-size: .85rem; font-weight: 600; color: var(--dr-ink); }
    .atlx-div-room .atlx-dr-move { display: block; font-size: .76rem; font-weight: 400; color: var(--dr-dim); }
    .atlx-div-room .atlx-dr-list { display: flex; flex-direction: column; gap: .6rem; margin-bottom: 1rem; }
    .atlx-div-room .atlx-dr-member { border: 1px solid var(--dr-line); border-radius: 6px; padding: .55rem .7rem; }
    .atlx-div-room .atlx-dr-member-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .45rem; }
    .atlx-div-room .atlx-dr-member-name { font-size: .86rem; font-weight: 600; color: var(--dr-ink); }
    .atlx-div-room .atlx-dr-status { font-size: .72rem; color: var(--dr-dim); border: 1px solid var(--dr-line); border-radius: 999px; padding: .1rem .5rem; white-space: nowrap; }
    .atlx-div-room .atlx-dr-status.sharing { color: var(--dr-amber); border-color: var(--dr-amber); }
    .atlx-div-room .atlx-dr-status.inside { color: #181818; background: var(--dr-amber); border-color: var(--dr-amber); font-weight: 600; }
    .atlx-div-room .atlx-dr-tokens { display: flex; gap: .35rem; flex-wrap: wrap; }
    .atlx-div-room .atlx-dr-token {
      font: inherit;
      font-size: .78rem;
      font-weight: 600;
      padding: .3rem .55rem;
      border-radius: 999px;
      border: 1px solid var(--dr-line);
      background: transparent;
      color: var(--dr-text);
      cursor: pointer;
    }
    .atlx-div-room .atlx-dr-token:focus-visible { outline: 2px solid var(--dr-amber); outline-offset: 2px; }
    .atlx-div-room .atlx-dr-token.shared { border-color: var(--dr-amber); color: var(--dr-ink); background: rgba(255,192,116,0.12); }
    .atlx-div-room .atlx-dr-stats { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem .8rem; border: 1px solid var(--dr-line); border-radius: 6px; padding: .7rem .8rem; margin-bottom: .2rem; }
    .atlx-div-room .atlx-dr-stat-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--dr-dim); }
    .atlx-div-room .atlx-dr-stat-val { font-family: var(--dr-code); font-size: 1rem; font-weight: 700; color: var(--dr-ink); margin-top: .1rem; }
    .atlx-div-room .atlx-dr-stat-note { font-size: .78rem; color: var(--dr-dim); margin: .45rem 0 1rem; }
    .atlx-div-room .atlx-dr-callout {
      position: relative;
      margin: 1rem 0 0;
      padding: .7rem .9rem;
      border: 1px solid rgba(255,192,116,0.75);
      border-radius: 6px;
      color: var(--dr-text);
      font-size: .92rem;
    }
    .atlx-div-room .atlx-dr-callout::before {
      content: "";
      position: absolute;
      top: -8px;
      left: 2.2rem;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 8px solid rgba(255,192,116,0.75);
    }
    .atlx-div-room .atlx-dr-callout strong { color: var(--dr-ink); }
  </style>
  <h3 class="atlx-dr-title">Bring it into the room</h3>
  <p class="atlx-dr-sub">Four teammates hold twelve things only they bring. Click one to share it into the middle and watch the room stretch toward everyone. Hold them back and the gap stays wide.</p>
  <noscript><p style="font-size:.9rem;">This figure is interactive, but the gist needs no script: every difference shared into the middle stretches the room toward the team and shrinks the gap to enter; everything held back leaves the room small.</p></noscript>

      </div>
      <div class="atlx-dr-list" id="ddr-team"></div>
      <div class="atlx-dr-stats">
        <div><div class="atlx-dr-stat-label">Room size</div><div class="atlx-dr-stat-val" id="ddr-stat-room"></div></div>
        <div><div class="atlx-dr-stat-label">In the room</div><div class="atlx-dr-stat-val" id="ddr-stat-shared"></div></div>
        <div><div class="atlx-dr-stat-label">Held back</div><div class="atlx-dr-stat-val" id="ddr-stat-held"></div></div>
        <div><div class="atlx-dr-stat-label">Gap to cross</div><div class="atlx-dr-stat-val" id="ddr-stat-gap"></div></div>
      </div>
      <p class="atlx-dr-stat-note">The smaller the gap, the easier it is to enter.</p>
      <div class="atlx-dr-callout" id="ddr-callout" aria-live="polite"></div>
    </div>
  </div>
  <script>
  (function(){
    var root = document.currentScript && document.currentScript.closest ? document.currentScript.closest('.atlx-div-room') : document.querySelector('.atlx-div-room');
    if(!root) return;
    var NS = 'http://www.w3.org/2000/svg';
    var INK = 'var(--dr-ink)', DIM = 'var(--dr-dim)', LINE = 'var(--dr-line)', AMBER = 'var(--dr-amber)';
    function el(name, attrs, parent){
      var n = document.createElementNS(NS, name);
      for(var k in attrs) n.setAttribute(k, attrs[k]);
      parent.appendChild(n);
      return n;
    }
    function txt(parent, x, y, s, size, weight, fill, anchor){
      var t = el('text', {x: x, y: y, 'font-size': size, 'font-weight': weight || 400, fill: fill || INK, 'text-anchor': anchor || 'middle', 'font-family': '"Cal Sans", sans-serif'}, parent);
      t.textContent = s;
      return t;
    }
    var MEMBERS = [
      {id: 'dev', code: 'SD', name: 'Senior Developer', tokens: ['English Lit. Degree', 'DBA Background', 'Writing & Feedback']},
      {id: 'test', code: 'TA', name: 'Testing Analyst', tokens: ['Tech Writer Past', 'Data Analysis', 'Manual Testing']},
      {id: 'ux', code: 'UX', name: 'UI/UX Analyst', tokens: ['Design Thinking', 'Cust. Journey Mapping', 'Persona Development']},
      {id: 'po', code: 'PO', name: 'Product Owner', tokens: ['Watchmaking Past', 'Personal Connections', 'Value Stream Mapping']}
    ];
    MEMBERS.forEach(function(m){ m.state = [false, false, false]; });
    var CX = 360, CY = 220, ORBIT = 160, RBASE = 50, RMAX = 195;
    var svg = root.querySelector('#ddr-svg');
    var teamBox = root.querySelector('#ddr-team');
    var statRoom = root.querySelector('#ddr-stat-room'), statShared = root.querySelector('#ddr-stat-shared');
    var statHeld = root.querySelector('#ddr-stat-held'), statGap = root.querySelector('#ddr-stat-gap');
    var callout = root.querySelector('#ddr-callout');
    var presetBtns = root.querySelectorAll('[data-preset]');
    function coords(i){
      var a = (i * 2 * Math.PI / MEMBERS.length) - (Math.PI / 2);
      return {x: CX + ORBIT * Math.cos(a), y: CY + ORBIT * Math.sin(a), a: a};
    }
    function renderControls(){
      teamBox.innerHTML = '';
      MEMBERS.forEach(function(m){
        var row = document.createElement('div');
        row.className = 'atlx-dr-member';
        var head = document.createElement('div');
        head.className = 'atlx-dr-member-head';
        var nm = document.createElement('span');
        nm.className = 'atlx-dr-member-name';
        nm.textContent = m.name;
        var st = document.createElement('span');
        st.className = 'atlx-dr-status';
        st.id = 'dr-status-' + m.id;
        st.textContent = 'Holding back';
        head.appendChild(nm);
        head.appendChild(st);
        row.appendChild(head);
        var toks = document.createElement('div');
        toks.className = 'atlx-dr-tokens';
        m.tokens.forEach(function(tn, ti){
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'atlx-dr-token' + (m.state[ti] ? ' shared' : '');
          b.textContent = tn;
          b.setAttribute('aria-pressed', String(m.state[ti]));
          b.addEventListener('click', function(){
            m.state[ti] = !m.state[ti];
            b.classList.toggle('shared', m.state[ti]);
            b.setAttribute('aria-pressed', String(m.state[ti]));
            clearPresets();
            updateAll();
          });
          toks.appendChild(b);
        });
        row.appendChild(toks);
        teamBox.appendChild(row);
      });
    }
    function clearPresets(){
      presetBtns.forEach(function(b){ b.setAttribute('aria-pressed', 'false'); });
    }
    function updateAll(){
      var shared = 0;
      MEMBERS.forEach(function(m){ m.state.forEach(function(s){ if(s) shared++; }); });
      var total = 12, held = total - shared;
      var radius = RBASE + (shared / total) * (RMAX - RBASE);
      var gap = Math.max(0, Math.round(ORBIT - radius));
      statRoom.textContent = Math.round(radius);
      statShared.textContent = shared + ' / 12';
      statHeld.textContent = String(held);
      statGap.textContent = String(gap);
      if(shared === 0){
        callout.innerHTML = '<strong>Held back:</strong> nothing enters. The room stays small and the gap to cross stays wide.';
      } else if(shared < 6){
        callout.innerHTML = '<strong>Stirring:</strong> ' + shared + ' in the middle. The room stretches toward the people who shared, and the gap shrinks for everyone.';
      } else if(shared < total){
        callout.innerHTML = '<strong>Opening:</strong> ' + shared + ' in the middle. The boundary touches contributors now; friction has somewhere to go.';
      } else {
        callout.innerHTML = '<strong>All in:</strong> everything the team brings is in the middle. No gap left to cross.';
      }
      svg.innerHTML = '';
      el('circle', {cx: CX, cy: CY, r: ORBIT, fill: 'none', stroke: LINE, 'stroke-width': 1.5, 'stroke-dasharray': '4 4'}, svg);
      el('circle', {cx: CX, cy: CY, r: radius, fill: AMBER, 'fill-opacity': 0.08}, svg);
      el('circle', {cx: CX, cy: CY, r: radius, fill: 'none', stroke: AMBER, 'stroke-width': 2}, svg);
      txt(svg, CX, CY - 2, 'The room', 12, 700, INK);
      txt(svg, CX, CY + 15, shared + ' in', 11, 400, DIM);
      var pi = 0;
      MEMBERS.forEach(function(m, idx){
        var pos = coords(idx);
        var inRoom = radius >= ORBIT - 12;
        var sharing = m.state.some(function(s){ return s; });
        var badge = root.querySelector('#dr-status-' + m.id);
        if(badge){
          badge.textContent = inRoom ? 'In the room' : (sharing ? 'Sharing' : 'Holding back');
          badge.className = 'atlx-dr-status' + (inRoom ? ' inside' : (sharing ? ' sharing' : ''));
        }
        var ex = CX + radius * Math.cos(pos.a), ey = CY + radius * Math.sin(pos.a);
        el('line', {x1: pos.x, y1: pos.y, x2: ex, y2: ey, stroke: sharing ? AMBER : DIM, 'stroke-width': sharing ? 2 : 1.5, 'stroke-dasharray': sharing ? 'none' : '3 3'}, svg);
        el('circle', {cx: pos.x, cy: pos.y, r: inRoom ? 18 : 15, fill: 'var(--dr-surface)', stroke: inRoom ? AMBER : INK, 'stroke-width': inRoom ? 2.5 : 2}, svg);
        txt(svg, pos.x, pos.y + 4, m.code, 10, 700, inRoom ? AMBER : INK);
        var lx = CX + (ORBIT + 28) * Math.cos(pos.a), ly = CY + (ORBIT + 28) * Math.sin(pos.a);
        txt(svg, lx, ly + 3, m.name, 10, 600, inRoom ? AMBER : DIM);
      });
      MEMBERS.forEach(function(m){
        m.state.forEach(function(on){
          if(!on) return;
          var pa = (pi * 2 * Math.PI / Math.max(1, shared)) + 0.35;
          var pd = 16 + ((pi % 3) * (radius * 0.22));
          el('circle', {cx: CX + pd * Math.cos(pa), cy: CY + pd * Math.sin(pa), r: 4.5, fill: AMBER}, svg);
          pi++;
        });
      });
      svg.setAttribute('viewBox', '0 0 720 440');
    }
    function applyPreset(mode){
      presetBtns.forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-preset') === mode)); });
      MEMBERS.forEach(function(m, i){
        if(mode === 'assimilate'){ m.state = [false, false, false]; }
        else if(mode === 'channel'){ m.state = [true, true, true]; }
        else {
          if(i === 0) m.state = [false, true, true];
          else if(i === 1) m.state = [false, true, true];
          else if(i === 2) m.state = [true, true, false];
          else m.state = [false, true, true];
        }
      });
      renderControls();
      updateAll();
    }
    presetBtns.forEach(function(b){
      b.addEventListener('click', function(){ applyPreset(b.getAttribute('data-preset')); });
    });
    renderControls();
    updateAll();
  })();
  </script>
</div>
