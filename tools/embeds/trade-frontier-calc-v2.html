<!-- Atlancia embed: Trade-off calculator v2 -->
<div class="atlx atlx-interact">
  <style>
    .atlx-interact{--int-ink:var(--atl-ink);--int-text:var(--atl-text);--int-dim:var(--atl-dim);--int-line:var(--atl-line);--int-surface:var(--atl-surface);--int-amber:var(--atl-accent);--int-warn:var(--atl-warning);font-family:"Figtree",ui-sans-serif,system-ui,sans-serif;background:var(--int-surface);color:var(--int-text);border:1px solid var(--int-line);border-radius:6px;padding:1.3rem 1.3rem 1.1rem;margin:2.5rem 0;max-width:100%;font-size:1rem;line-height:1.55}*{box-sizing:border-box}.atlx-interact .atlx-i-kick{margin:0 0 .4rem;font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--int-amber)}.atlx-interact .atlx-i-title{margin:0 0 .2rem;font-family:"Aleo",Georgia,serif;font-weight:500;font-size:1.25rem;line-height:1.35;color:var(--int-ink)}.atlx-interact .atlx-i-sub{margin:0 0 .9rem;color:var(--int-dim);font-size:.95rem}.atlx-interact .atlx-i-row{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin:.7rem 0 .2rem}.atlx-interact .atlx-i-label{font-weight:600;color:var(--int-ink);font-size:.95rem}.atlx-interact output{font-variant-numeric:tabular-nums;font-weight:600;color:var(--int-amber);font-size:.95rem}.atlx-interact input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0;cursor:pointer}.atlx-interact input[type="range"]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:#333}.atlx-interact input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--int-amber);border:3px solid #181818;margin-top:-7px}.atlx-interact input[type="range"]::-moz-range-track{height:6px;border-radius:999px;background:#333}.atlx-interact input[type="range"]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--int-amber);border:3px solid #181818}.atlx-interact input[type="range"]:focus-visible{outline:2px solid var(--int-amber);outline-offset:4px;border-radius:999px}.atlx-interact .atlx-i-read{font-variant-numeric:tabular-nums;margin:.5rem 0 .7rem;color:var(--int-ink);font-size:.98rem}.atlx-interact .atlx-i-read .dim{color:var(--int-dim)}.atlx-interact .atlx-i-note{margin:.65rem 0 0;font-size:.9rem;color:var(--int-dim);min-height:2.4em}
  </style>
  <p class="atlx-i-kick">Move the balance and see the price</p>
  <h3 class="atlx-i-title">What the choice costs</h3>
  <p class="atlx-i-sub">Every point of pace is paid in endurance. Slide to see the price.</p>
  <div class="atlx-i-row"><label class="atlx-i-label" for="atlx-c2">Pace you buy</label><output id="atlx-c2-o">55</output></div>
  <input id="atlx-c2" type="range" min="5" max="95" step="1" value="55">
  <p class="atlx-i-read" id="atlx-c2-r"></p>
  <script>
    (function(){var r=document.currentScript;var root=r&&r.closest?r.closest(".atlx-interact"):document.querySelector(".atlx-interact");if(!root)return;var range=root.querySelector("#atlx-c2");var out=root.querySelector("#atlx-c2-o");var read=root.querySelector("#atlx-c2-r");function render(){var v=Number(range.value);out.textContent=v;var e=Math.round(Math.max(25,92*Math.sqrt(Math.max(0,1-(v/95)*(v/95)))));read.innerHTML="<span class=\"dim\">Read:</span> pace "+v+", endurance "+e+". The order leans "+(v<=40?"patient":"fast")+".";}range.addEventListener("input",render);render();})();
  </script>
</div>
