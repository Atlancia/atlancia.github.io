<!-- Atlancia embed: The translator between two rooms (static diagram).
     Fits the post Changing Requirements to be a Successful Business Analyst.
     Paste this whole file into a Publii HTML block where the figure should sit. -->
<div class="atlx atlx-figure">
  <style>
    .atlx-figure {
      --fg-ink: var(--atl-ink); --fg-text: var(--atl-text); --fg-dim: var(--atl-dim); --fg-line: var(--atl-line);
      --fg-surface: var(--atl-surface); --fg-amber: var(--atl-accent); --fg-info: var(--atl-info); --fg-green: var(--atl-success);
      --fg-hl: var(--atl-highlight); --fg-warn: var(--atl-warning);
      font-family: 'Figtree', ui-sans-serif, system-ui, sans-serif;
      background: var(--fg-surface); color: var(--fg-text);
      border: 1px solid var(--fg-line); border-radius: 6px;
      padding: 1.3rem 1.3rem 1rem; margin: 2.5rem 0; max-width: 100%;
      font-size: 1rem; line-height: 1.55;
    }
    .atlx-figure * { box-sizing: border-box; }
    .atlx-figure .atlx-g-kick {
      margin: 0 0 .4rem; font-size: .72rem; font-weight: 600;
      letter-spacing: .14em; text-transform: uppercase; color: var(--fg-amber);
    }
    .atlx-figure .atlx-g-title {
      margin: 0 0 .2rem; font-family: 'Aleo', Georgia, serif; font-weight: 500;
      font-size: 1.25rem; line-height: 1.35; color: var(--fg-ink);
    }
    .atlx-figure svg { display: block; width: 100%; height: auto; margin: .6rem 0 .3rem; }
    .atlx-figure .atlx-g-cap {
      margin: .5rem 0 0; font-size: .9rem; color: var(--fg-dim); font-style: italic;
      font-family: 'Aleo', Georgia, serif;
    }
  </style>

  <p class="atlx-g-kick">A working picture</p>
  <h3 class="atlx-g-title">The translator between two rooms</h3>

  <svg viewBox="0 0 640 320" role="img" aria-label="Two rooms, the business and the builders, with a translator passing meaning both ways between them">
    <rect x="0" y="0" width="640" height="320" fill="transparent"/>

    <!-- the business -->
    <text x="130" y="34" text-anchor="middle" fill="#9D9D9D" font-size="12.5" font-family="Figtree, sans-serif">the business</text>
    <rect x="30" y="46" width="200" height="228" rx="12" fill="#232323" stroke="#373737" stroke-width="1.5"/>
    <circle cx="70" cy="100" r="9" fill="#FFC074"/>
    <text x="92" y="105" fill="#BFBFBF" font-size="14" font-family="Figtree, sans-serif">wants</text>
    <rect x="62" y="150" width="18" height="18" rx="3" fill="#5B9ED5"/>
    <text x="92" y="164" fill="#BFBFBF" font-size="14" font-family="Figtree, sans-serif">rules</text>
    <polygon points="71,206 80,222 62,222" fill="#54A468"/>
    <text x="92" y="220" fill="#BFBFBF" font-size="14" font-family="Figtree, sans-serif">habits</text>

    <!-- the builders -->
    <text x="510" y="34" text-anchor="middle" fill="#9D9D9D" font-size="12.5" font-family="Figtree, sans-serif">the builders</text>
    <rect x="410" y="46" width="200" height="228" rx="12" fill="#232323" stroke="#373737" stroke-width="1.5"/>
    <rect x="452" y="91" width="18" height="18" rx="4" fill="#F6DC90"/>
    <text x="482" y="105" fill="#BFBFBF" font-size="14" font-family="Figtree, sans-serif">systems</text>
    <polygon points="461,150 470,165 461,180 452,165" fill="#FB6762"/>
    <text x="482" y="164" fill="#BFBFBF" font-size="14" font-family="Figtree, sans-serif">fields</text>
    <line x1="452" y1="216" x2="470" y2="216" stroke="#9D9D9D" stroke-width="2.5"/>
    <line x1="452" y1="210" x2="470" y2="210" stroke="#9D9D9D" stroke-width="2.5" opacity="0.5"/>
    <line x1="452" y1="222" x2="470" y2="222" stroke="#9D9D9D" stroke-width="2.5" opacity="0.5"/>
    <text x="482" y="220" fill="#BFBFBF" font-size="14" font-family="Figtree, sans-serif">flows</text>

    <!-- the translating between -->
    <line x1="240" y1="116" x2="392" y2="116" stroke="#4a4a4a" stroke-width="2"/>
    <polygon points="400,116 386,109 386,123" fill="#4a4a4a"/>
    <text x="320" y="104" text-anchor="middle" fill="#F6DC90" font-size="12.5" font-family="Figtree, sans-serif">translate</text>

    <line x1="400" y1="204" x2="248" y2="204" stroke="#4a4a4a" stroke-width="2"/>
    <polygon points="240,204 254,197 254,211" fill="#4a4a4a"/>
    <text x="320" y="228" text-anchor="middle" fill="#F6DC90" font-size="12.5" font-family="Figtree, sans-serif">check back</text>

    <rect x="279" y="143" width="82" height="34" rx="17" fill="#262626" stroke="#373737"/>
    <text x="320" y="165" text-anchor="middle" fill="#EEEDED" font-size="12.5" font-family="Figtree, sans-serif">the analyst</text>
  </svg>

  <p class="atlx-g-cap">The requirement is the agreement. The document is only its shadow.</p>
</div>
