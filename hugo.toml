baseURL = "https://atlancia.com/"
languageCode = "en-gb"
title = "Atlancia"
timeZone = "America/Toronto"

# The published addresses are flat files at the root, so /leaders-gardeners.html
# rather than /leaders-gardeners/. The slug in each post drives the address.
uglyURLs = true
enableRobotsTXT = false
enableEmoji = false
summaryLength = 45
capitalizeListTitles = false

[taxonomies]
  author = "authors"
  tag = "tags"

[permalinks]
  posts = "/:slug"

[outputs]
  home = ["HTML", "RSS", "JSONFeed"]
  page = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[mediaTypes."application/feed+json"]
  suffixes = ["json"]

[outputFormats]
  [outputFormats.RSS]
    mediaType = "application/rss+xml"
    baseName = "feed"
  [outputFormats.JSONFeed]
    mediaType = "application/feed+json"
    baseName = "feed"
    isPlainText = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.goldmark.extensions]
    # The published text keeps the author's own punctuation, including the
    # straight apostrophes, so the smart quotes are turned off.
    [markup.goldmark.extensions.typographer]
      disable = true
  [markup.highlight]
    noClasses = false

[services]
  [services.rss]
    limit = 50
