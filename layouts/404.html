{{ define "main" }}
<main class="page page--error">
    <div class="content">
        <div class="hero">
            <header class="hero__content">
                <div class="wrapper">
                    <h1>404</h1>
                    <div class="page__desc">
                        <p>The page you were looking for appears to have been moved, deleted or does not exist. You could go back to where you were or head straight to our home page.</p>
                    </div>
                    <a href="{{ site.BaseURL }}" class="btn hero__cta btn--icon">
                        <svg width="18" height="18" aria-hidden="true">
                            <use xlink:href="{{ site.BaseURL }}assets/svg/svg-map.svg#arrow-prev"></use>
                        </svg> <span>Go home</span>
                    </a>
                </div>
            </header>
        </div>
    </div>
</main>
{{ end }}
