<!DOCTYPE html>
<html lang="en-gb">
<head>
{{ partial "head.html" . }}
</head>
<body class="{{ if eq .Kind "404" }}error-template{{ else if eq .Type "posts" }}post-template{{ else }}{{ .Params.body_class | default "page-template" }}{{ end }}">
{{ partial "navbar.html" . }}
{{ block "main" . }}{{ end }}
{{ if eq .Type "posts" }}{{ partial "footer.html" (dict "page" . "glued" true) }}{{ else }}{{ partial "footer.html" . }}{{ end }}
</body>
</html>
