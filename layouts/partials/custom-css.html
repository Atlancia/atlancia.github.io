<style>
/* Comment block, carried over from the GraphComment plugin configuration. */
blockquote {
    border: none !important;
    border-left: 3px solid var(--color) !important;
    color: var(--text-color) !important;
    font-family: var(--heading-font) !important;
    font-style: italic;
    font-variation-settings: "wght" var(--font-weight-light);
    font-size: 1.25em !important;
    line-height: 1.4 !important;
    margin: 2em 0 !important;
    padding: 0 0 0 2em !important;
    background: none !important;
  }

  :root {
    --text-color: #D9D9D9 !important;
  }

  .custom-h2 {
    font-size: clamp(1.3808rem, 1.3808rem + 0.9332 * (100vw - 20rem) / 70, 2.3141rem);
    color: var(--headings-color);
    font-family: var(--heading-font);
    font-variation-settings: "wght" var(--headings-weight);
    font-style: var(--headings-style);
    -ms-hyphens: manual;
    hyphens: manual;
    letter-spacing: var(--headings-letter-spacing);
    line-height: var(--headings-line-height);
    margin-top: 0 !important;  /* override top margin/padding */
    text-transform: var(--headings-transform);
  }

  .custom-h2 + * {
    margin-top: calc(var(--baseline) * 2 + 0.25vw);
  }

  .graphcomment-container,
  .graphcomment-root,
  .graphcomment,
  iframe[src*="graphcomment.com"] {
    box-sizing: border-box;
    border-radius: 8px !important;
    overflow: hidden !important;
    border: none !important;
  }

  /* Updated styles for Publii comments wrapper and inner wrapper with responsive sizing and increased width */

.my-comments-wrapper {
  padding: 0;
  background: #2a2929;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
  box-sizing: border-box;
}

.my-comments-inner {
  padding: calc(var(--baseline) * 5) calc(var(--page-margin) * 0.2);
  box-sizing: border-box;
}

/* Theme override: the published site forced this background colour. */
:root,
[data-theme="dark"],
html {
    --page-bg: #23233d !important;
}

body {
    background: #23233d !important;
}

/*
 * Body headings were level one in the published markup. They are level two
 * here, so the document outline is correct, and this rule keeps the size
 * the theme gave them.
 */
.content__entry h2 {
    font-size: clamp(1.5710900065rem, 1.5710900065rem + 1.424540906 * (100vw - 20rem) / 70, 2.9956309125rem);
}

/*
 * The theme tightens the space that follows a level two heading. The
 * headings inside an essay are level two, so the space after them is put
 * back to what it was when they were level one.
 */
.content__entry h2 + p,
.content__entry h2 + ul,
.content__entry h2 + ol,
.content__entry h2 + dl {
    margin-top: calc(var(--baseline) * 4 + .25vw);
}

.content__entry h2 + blockquote,
.content__entry h2 + figure,
.content__entry h2 + hr,
.content__entry h2 + pre,
.content__entry h2 + table {
    margin-top: calc(var(--baseline) * 6 + .5vw);
}

.content__entry h2 + h1,
.content__entry h2 + h2,
.content__entry h2 + h3,
.content__entry h2 + h4,
.content__entry h2 + h5,
.content__entry h2 + h6 {
    margin-top: calc(var(--baseline) * 6 + 1vw);
}

/*
 * An image on a line of its own is a paragraph in Markdown. The browser
 * closes that paragraph before the figure, which leaves an empty paragraph
 * behind it. Taking it out of the flow puts the figure back where the
 * previous build published it, with the same space above and below it.
 */
.content__entry p:empty {
    display: none;
}

/*
 * Two images in the oldest essay were published inside a figure. They are
 * marked up as a picture here, which carries no box of its own, so it is
 * given the same one.
 */
.content__entry picture {
    display: block;
    margin-top: calc(var(--baseline) * 6 + .5vw);
    margin-bottom: calc(var(--baseline) * 6 + .5vw);
}
</style>
